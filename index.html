      (function () {
        try {
          var t = localStorage.getItem("malyshdok:theme") || "system";
          if (localStorage.getItem("malyshdok:themeMode") === "night") {
            var h = new Date().getHours();
            t = h >= 21 || h < 7 ? "dark" : "light";
            localStorage.setItem("malyshdok:theme", t);
          }
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) { metas[i].removeAttribute("media"); metas[i].setAttribute("content", dark ? "#13161c" : "#f9f8f5"); }
        } catch (e) {}
      })();

<script>
  (function () {
    var el = document.getElementById("splash");
    var standalone = false;
    try {
      standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    } catch (e) {}
    var forced = /[?&]splash=1/.test(location.search);
    if (!standalone && !forced) { el.parentNode.removeChild(el); window.__hideSplash = function () {}; return; }
    var start = Date.now(), done = false;
    function hide() {
      if (done) return; done = true;
      var wait = Math.max(0, 3200 - (Date.now() - start));
      setTimeout(function () {
        el.classList.add("splash-hide");
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
      }, wait);
    }
    window.__hideSplash = hide;
    setTimeout(hide, 8000);
  })();
</script>
